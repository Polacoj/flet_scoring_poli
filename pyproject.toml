[project]
name = "scoring-poli"
version = "1.0.0"
description = "Sistema de Scoring — Oficiales: diccionario, productividad general y productividad imputados con interfaz Flet 1.0."
readme = "README.md"
authors = [
    { name = "Polacoj", email = "polacoj@hotmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "flet==1.0.3",
    "flet-desktop==1.0.3",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
]

# Es una aplicación, no un paquete instalable: main.py + core/ + ui/ viven en
# la raíz y se ejecutan con ./scoring-poli o `uv run python main.py`.
[tool.uv]
package = false

[tool.flet.metadata]
title = "Sistema de Scoring — Oficiales"
